# worktrunk user config - https://worktrunk.dev/config/
# Managed by chezmoi (dotfiles/dot_config/worktrunk/config.toml)

# Project-specific settings live under [projects."<host>/<owner>/<repo>"] so
# nothing has to be committed to the team repo (and no approval prompts).

# principle-theorem: bare repo (.bare) with worktrees as siblings in the repo root.
# Replaces .tools/new-worktree.
[projects."github.com/principle-theorem/principle-theorem"]
# repo_path is the .bare dir for bare repos, so ../ is the repo root.
worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

# Blocking setup: link shared files, then install deps.
[[projects."github.com/principle-theorem/principle-theorem".pre-start]]
shared = "for item in ../.shared/.[!.]* ../.shared/*; do [ -e \"$item\" ] && ln -sf \"$item\" .; done; true"

[[projects."github.com/principle-theorem/principle-theorem".pre-start]]
deps = "pnpm clean && pnpm install --frozen-lockfile"
