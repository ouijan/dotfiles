# Wildcard worktree auto-layout: applies to any repo without a specific layout.
# Fires on `herdr worktree create/open`. Filename doesn't matter; presence = on.
# Specificity: repo+branch > repo > wildcard+branch > wildcard(this).
repo = "*"

[[tabs]]
name = "1"

  [[tabs.panes]]
  command = "pi"

  [[tabs.panes]]
  split = "right"
  command = "nvim"

  [[tabs.panes]]
  split = "bottom"



