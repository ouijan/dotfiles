  "~/.config/herdr/sounds/library/Archer/ArcherWhat2.mp3",
  "~/.config/herdr/sounds/library/Archer/ArcherWhat3.mp3",
  "~/.config/herdr/sounds/library/Archer/ArcherWhat4.mp3",
