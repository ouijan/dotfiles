onboarding = false

[session]
# Restart supported agent panes into their previous conversation after a server restart
resume_agents_on_restore = true

[keys]
# Match tmux leader (ctrl+s)
prefix = "ctrl+s"

# Splits: tmux | and - (open in current dir is herdr default behavior)
split_vertical = ["prefix+v"]
split_horizontal = ["prefix+minus"]

# Pane navigation: prefix+hjkl (default) plus direct ctrl+alt chords
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]




# vim-herdr-navigation: vim-aware ctrl+hjkl (vim-tmux-navigator for herdr)
# install: herdr plugin install --yes paulbkim-dev/vim-herdr-navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# herdr-plus plugin actions
[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[theme]
# Catppuccin mocha, matching tmux status colors
name = "catppuccin"

auto_switch = false
[theme.custom]
accent = "#89b4fa"
green = "#a6e3a1"
blue = "#89b4fa"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
sidebar_collapsed_mode = "hidden"
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = "zoom" },
  # { type = "hostname" },
  # { type = "datetime", format = "%H:%M" },
  { type = "text", text = "Terminal by toby" },
  # { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

# Surface pi-subagents activity in the agent sidebar.
# pi-subagents publishes a `title-suffix` into pane metadata whenever async
# subagents are running (agent name for one, a count for several, `⚠` when a
# child needs attention). Without a row referencing `state_text` that label is
# published but never rendered.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  # ["agent", "tab"],
  ["state_text"],
]

[ui.toast]
delivery = "terminal"

# Agent-event sounds are owned by the toby.herdr-agent-sounds plugin, which
# picks randomly from pools instead of Herdr's one-file-per-event limit.
# See plugins/config/toby.herdr-agent-sounds/config.toml, switch packs with
# `herdr-soundpack use <pack>`.
#
# enabled = false stops agent events playing twice. The paths below still
# serve `herdr notification show --sound`, which the plugin does not
# intercept. Relative to this file, so no machine-specific absolute paths.
[ui.sound]
enabled = false
path = "sounds/library/Local/UndertakersBell.mp3"
done_path = "sounds/library/Local/JobsDone.mp3"
request_path = "sounds/library/Local/WorkWork.mp3"

